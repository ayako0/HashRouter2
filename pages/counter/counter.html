<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Button Click Counter</title>
</head>
<body>

    <!-- The button that triggers the function when clicked -->
    <button type="button" onclick="countClicks()">Click me</button>

    <!-- The paragraph where the count will be displayed -->
    <p>Clicks: <span id="counterDisplay">0</span></p>

    <!--script>
        // Initialize the counter variable
        let clicks = 0;

        // The JavaScript function that handles the logic
        function countClicks() {
            clicks += 1; // Increment the count by 1
            
            // Find the HTML element by its ID and update its text
            document.getElementById("counterDisplay").textContent = clicks;
        }
    </script-->

</body>
</html>
