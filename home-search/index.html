<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Currency Converter</title>
</head>
<body>
  <h2>Live Currency Converter</h2>
  <input type="number" id="amount" value="1" />
  <select id="fromCurrency"></select>
  <select id="toCurrency"></select>
  <button id="convertBtn">Convert</button>
  <p id="result"></p>

  <script>
    const apiKey = 'YOUR_API_KEY'; // Get a free key from ExchangeRate-API
    const fromSelect = document.getElementById('fromCurrency');
    const toSelect = document.getElementById('toCurrency');
    
    // Populate simple currency options
    const currencies = ['USD', 'EUR', 'GBP', 'INR', 'JPY'];
    currencies.forEach(cur => {
      fromSelect.innerHTML += `<option value="${cur}">${cur}</option>`;
      toSelect.innerHTML += `<option value="${cur}">${cur}</option>`;
    });

    document.getElementById('convertBtn').addEventListener('click', async () => {
      const amount = document.getElementById('amount').value;
      const from = fromSelect.value;
      const to = toSelect.value;

      try {
        // Fetch real-time data using JavaScript fetch()
        const response = await fetch(`https://v6.exchangerate-api.com/v6/${apiKey}/latest/${from}`);
        const data = await response.json();
        
        const rate = data.conversion_rates[to];
        const converted = (amount * rate).toFixed(2);
        
        document.getElementById('result').innerText = `${amount} ${from} = ${converted} ${to}`;
      } catch (error) {
        document.getElementById('result').innerText = 'Error fetching exchange rate.';
      }
    });
  </script>
</body>
</html>
